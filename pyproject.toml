[project]
name = "colab-mcp"
version = "1.0.1"
description = "An MCP server for Colab"
readme = "README.md"
authors = [
    { name = "Tyler Pirtle", email = "rtp@google.com" },
    { name = "Josie Cuff", email = "josiecuff@google.com" },
]
requires-python = ">=3.13"
dependencies = [
    "websockets==17.4",
]

[project.scripts]
colab-mcp = "colab_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest==9.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/colab_mcp", "src/minimcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
